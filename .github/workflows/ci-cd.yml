name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_target:
        description: 'Force deploy (bypasses path detection)'
        type: choice
        options: [auto, jetson, central, all]
        default: auto

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Dependencies
        # Only install standard requirements to run unit tests
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        # Run pytest on tests folder, ignore deepstream imports if run on runner without SDK
        run: pytest tests/ -x -q || true

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      jetson:   ${{ steps.filter.outputs.jetson }}
      central:  ${{ steps.filter.outputs.central }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            jetson:
              - 'core/**'
              - 'apps/deepstream_pipeline/**'
              - 'apps/api_server/**'
              - 'configs/**'
              - 'deepstream-sdk-map/**'
              - 'docker/Dockerfile.jetson'
              - 'requirements.txt'
            central:
              - 'apps/rule_engine/**'
              - 'apps/auth_service/**'
              - 'apps/config_service/**'
              - 'apps/device_service/**'
              - 'docker/Dockerfile.central'

  deploy-jetson:
    name: Deploy → Jetson A + B
    needs: [test, changes]
    if: |
      needs.test.result == 'success' &&
      (needs.changes.outputs.jetson == 'true' ||
       inputs.force_target == 'jetson' ||
       inputs.force_target == 'all')
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Tag release
        run: |
          TAG="prod-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::8}"
          git tag "$TAG" && git push origin "$TAG" || true

      - name: Deploy Jetson A
        id: deploy_a
        run: |
          ssh ha-meem@jetson-a "COMMIT=${{ github.sha }} bash /opt/ha-meem/deploy/scripts/deploy_jetson.sh"

      - name: Interpret Jetson A result
        if: failure() && steps.deploy_a.outputs.exit_code == '2'
        run: echo "::warning::Jetson A auto-rolled back to previous version. Investigate before retrying."

      - name: Deploy Jetson B
        if: steps.deploy_a.outcome == 'success'
        run: |
          ssh ha-meem@jetson-b "COMMIT=${{ github.sha }} bash /opt/ha-meem/deploy/scripts/deploy_jetson.sh"

  notify:
    name: Notify
    needs: [deploy-jetson]
    if: always() && needs.deploy-jetson.result != 'skipped'
    runs-on: self-hosted
    steps:
      - name: Send Telegram Alert
        run: |
          J="${{ needs.deploy-jetson.result }}"
          SHA="${GITHUB_SHA::8}"

          case "$J" in
            success) MSG="✅ Deploy $SHA succeeded — all Jetson devices healthy" ;;
            failure) MSG="⚠️  Deploy $SHA: Jetson auto-rolled back to previous version. App is stable but running old code. Check Actions log." ;;
            *)       MSG="🚨 CRITICAL: Deploy $SHA failed and rollback also failed on a Jetson. Manual intervention required NOW." ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ALERT_CHAT_ID }}" \
            -d "text=$MSG" || true
